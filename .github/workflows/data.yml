name: Refresh FPL data

# The FPL API returns 403 to the hosts we work on (PythonAnywhere free
# accounts, cloud containers behind policy proxies). GitHub's runners can
# reach it, so fetch the data here and commit it — everywhere else reads it
# with `git pull` instead of guessing prices off third-party sites.

on:
  schedule:
    # Six times a day. The 02:07 run lands just after FPL's ~01:30 UTC price
    # change lock, and the rest keep the snapshot inside the six-hour window
    # the CLI treats as fresh. Minute :07 because GitHub's scheduler is most
    # congested on the hour — scheduled runs are best-effort and can be
    # delayed or skipped, so trigger this by hand before a deadline rather
    # than trusting the schedule to have landed.
    - cron: "7 2,6,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch the FPL API
        run: python tools/fetch_snapshot.py

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap.json data/fixtures.json data/meta.json
          if git diff --quiet --cached; then
            echo "No change in the FPL data; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh FPL data snapshot

          Fetched by the scheduled Refresh FPL data workflow."
          # The schedule and a manual run can overlap with a push, so rebase
          # onto whatever landed first rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt/3)..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
